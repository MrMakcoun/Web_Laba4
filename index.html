<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mesto</title>
    <link rel="icon" type="image/svg+xml" href="./src/images/logo.svg" />
    <link rel="stylesheet" href="./src/pages/index.css" />
  </head>
  <body class="page">
    <div class="page__content">
      <header class="header page__section">
        <img src="./src/images/logo.svg" alt="Mesto" class="logo header__logo" />
      </header>
      <main class="content">
        <section class="profile page__section" aria-label="Профиль">
          <button class="profile__image" type="button" aria-label="Обновить аватар"></button>
          <div class="profile__info">
            <h1 class="profile__title">Жак-Ив Кусто</h1>
            <button class="profile__edit-button" type="button" aria-label="Редактировать профиль"></button>
            <p class="profile__description">Исследователь океана</p>
          </div>
          <button class="profile__add-button" type="button" aria-label="Новое место"></button>
        </section>
        <section class="places page__section" aria-label="Галерея мест">
          <ul class="places__list"></ul>
        </section>
      </main>
      <footer class="footer page__section">
        <p class="footer__copyright">© 2026 Mesto Russia</p>
      </footer>

      <div class="popup popup_type_edit" role="dialog" aria-modal="true" aria-labelledby="edit-profile-title">
        <div class="popup__content">
          <button type="button" class="popup__close" aria-label="Закрыть"></button>
          <h2 class="popup__title" id="edit-profile-title">Редактировать профиль</h2>
          <form class="popup__form" name="edit-profile" novalidate>
            <label class="popup__label">
              <input type="text" name="user-name" id="user-name" class="popup__input popup__input_type_name"
                placeholder="Имя" aria-label="Имя" aria-describedby="user-name-error" required minlength="2" maxlength="40" pattern="^[a-zA-Zа-яА-ЯёЁ\s\-]+$" data-error-message="Разрешены только русские и латинские буквы, дефисы и пробелы." />
              <span class="popup__error" id="user-name-error" aria-live="polite"></span>
            </label>
            <label class="popup__label">
              <input type="text" name="user-description" id="user-description" class="popup__input popup__input_type_description"
                placeholder="Занятие" aria-label="Занятие" aria-describedby="user-description-error" required minlength="2" maxlength="200" />
              <span class="popup__error" id="user-description-error" aria-live="polite"></span>
            </label>
            <button type="submit" class="button popup__button popup__button_disabled" disabled>Сохранить</button>
          </form>
        </div>
      </div>

      <div class="popup popup_type_new-card" role="dialog" aria-modal="true" aria-labelledby="new-place-title">
        <div class="popup__content">
          <button type="button" class="popup__close" aria-label="Закрыть"></button>
          <h2 class="popup__title" id="new-place-title">Новое место</h2>
          <form class="popup__form" name="new-place" novalidate>
            <label class="popup__label">
              <input type="text" name="place-name" id="place-name" class="popup__input popup__input_type_card-name"
                placeholder="Название" aria-label="Название" aria-describedby="place-name-error" required minlength="2" maxlength="30" pattern="^[a-zA-Zа-яА-ЯёЁ\s\-]+$" data-error-message="Разрешены только русские и латинские буквы, дефисы и пробелы." />
              <span class="popup__error" id="place-name-error" aria-live="polite"></span>
            </label>
            <label class="popup__label">
              <input type="url" name="place-link" id="place-link" class="popup__input popup__input_type_url"
                placeholder="Ссылка на картинку" aria-label="Ссылка на картинку" aria-describedby="place-link-error" required />
              <span class="popup__error" id="place-link-error" aria-live="polite"></span>
            </label>
            <label class="popup__label">
              <input type="text" name="place-region" id="place-region" class="popup__input popup__input_type_region"
                placeholder="Город / Регион" aria-label="Город / Регион" aria-describedby="place-region-error" required minlength="2" maxlength="30" pattern="^[a-zA-Zа-яА-ЯёЁ\s\-]{2,30}$" data-error-message="Введите от 2 до 30 символов. Разрешены буквы, пробелы и дефисы." />
              <span class="popup__error" id="place-region-error" aria-live="polite"></span>
            </label>
            <button type="submit" class="button popup__button popup__button_disabled" disabled>Создать</button>
          </form>
        </div>
      </div>

      <div class="popup popup_type_edit-avatar" role="dialog" aria-modal="true" aria-labelledby="edit-avatar-title">
        <div class="popup__content">
          <button type="button" class="popup__close" aria-label="Закрыть"></button>
          <h2 class="popup__title" id="edit-avatar-title">Обновить аватар</h2>
          <form class="popup__form" name="edit-avatar" novalidate>
            <label class="popup__label">
              <input type="url" name="user-avatar" id="user-avatar" class="popup__input popup__input_type_url"
                placeholder="Ссылка на изображение" aria-label="Ссылка на изображение" aria-describedby="user-avatar-error" required />
              <span class="popup__error" id="user-avatar-error" aria-live="polite"></span>
            </label>
            <button type="submit" class="button popup__button popup__button_disabled" disabled>Сохранить</button>
          </form>
        </div>
      </div>

      <div class="popup popup_type_image" role="dialog" aria-modal="true" aria-label="Просмотр фотографии">
        <div class="popup__content popup__content_content_image">
          <button type="button" class="popup__close" aria-label="Закрыть"></button>
          <img alt="" class="popup__image" />
          <p class="popup__caption"></p>
        </div>
      </div>

      <div class="toast" role="status" aria-atomic="true"></div>
    </div>

    <template id="card-template">
      <li class="places__item card">
        <button type="button" class="card__preview"><img class="card__image" alt="" /></button>
        <div class="card__control">
          <button type="button" class="card__control-button card__control-button_type_delete"
            aria-label="Удалить карточку"></button>
        </div>
        <div class="card__description">
          <div class="card__details">
            <h2 class="card__title"></h2>
            <p class="card__region" hidden></p>
          </div>
          <button type="button" class="card__like-button" aria-label="Нравится" aria-pressed="false"></button>
        </div>
      </li>
    </template>
    <script type="module" src="./src/scripts/index.js"></script>
  </body>
</html>
